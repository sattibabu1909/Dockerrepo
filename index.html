<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieHub - Online Movie Booking</title>

  <style>
    :root {
      --primary: #e50914;
      --primary-dark: #b20710;
      --background: #0b0b0f;
      --surface: #15151d;
      --surface-light: #22222d;
      --text: #ffffff;
      --muted: #a8a8b3;
      --border: rgba(255, 255, 255, 0.1);
      --success: #25d366;
      --gold: #ffc107;
    }

    body.light-theme {
      --background: #f3f4f6;
      --surface: #ffffff;
      --surface-light: #e9e9ef;
      --text: #15151d;
      --muted: #656572;
      --border: rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 15, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(15px);
    }

    body.light-theme header {
      background: rgba(255, 255, 255, 0.95);
    }

    .navbar {
      max-width: 1250px;
      margin: auto;
      padding: 17px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--primary);
      font-size: 26px;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo span {
      color: var(--text);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .icon-btn {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      font-size: 17px;
    }

    .hero {
      max-width: 1250px;
      margin: 28px auto;
      min-height: 350px;
      padding: 65px 50px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.2)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1500&q=80")
        center/cover;
    }

    .hero-content {
      max-width: 570px;
    }
