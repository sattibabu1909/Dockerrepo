<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineBook - Movie Ticket Booking</title>

  <style>
    :root {
      --primary: #e50914;
      --primary-dark: #b20710;
      --bg: #0b0b12;
      --card: #171722;
      --card-light: #222231;
      --text: #ffffff;
      --muted: #a7a7b5;
      --available: #343449;
      --selected: #e50914;
      --occupied: #666675;
      --success: #27c781;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 7%;
      background: rgba(11, 11, 18, 0.95);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #252535;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--primary);
    }

    nav {
      display: flex;
      gap: 26px;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      transition: 0.3s;
    }

    nav a:hover {
      color: white;
    }

    .profile-btn,
    .hero-btn,
    .book-btn,
    .pay-btn {
      border: none;
      color: white;
      background: var(--primary);
      padding: 11px 19px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      background: var(--primary-dark);
    }

    .hero {
      min-height: 430px;
      display: flex;
      align-items: center;
      padding: 70px 7%;
      background:
        linear-gradient(90deg, #0b0b12 15%, rgba(11, 11, 18, 0.65), rgba(11, 11, 18, 0.2)),
        url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero small {
      color: #ff4f58;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: 1;
      margin: 18px 0;
    }

    .hero p {
      color: #d2d2da;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .container {
      width: 86%;
      max-width: 1250px;
      margin: 45px auto;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .section-title h2 {
      font-size: 28px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters select,
    .search-box {
      background: var(--card);
      color: white;
      border: 1px solid #333344;
      padding: 12px 14px;
      border-radius: 8px;
      outline: none;
    }

    .search-box {
      min-width: 230px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .movie-card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      transition: 0.3s;
      border: 1px solid transparent;
    }

    .movie-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      box-shadow: 0 12px 35px rgba(229, 9, 20, 0.18);
    }

    .movie-poster {
      height: 305px;
      width: 100%;
      object-fit: cover;
    }

    .movie-info {
      padding: 17px;
    }

    .movie-info h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .movie-info p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .rating {
      color: #ffc107;
    }

    .book-btn {
      width: 100%;
    }

    /* Booking modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 850px;
      max-height: 92vh;
      overflow-y: auto;
      background: #13131d;
      border: 1px solid #343447;
      border-radius: 17px;
      padding: 27px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 23px;
      top: 18px;
      font-size: 28px;
      cursor: pointer;
      color: var(--muted);
    }

    .booking-header {
      margin-bottom: 25px;
      padding-right: 35px;
    }

    .booking-header p {
      color: var(--muted);
      margin-top: 7px;
    }

    .date-row,
    .time-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 25px;
    }

    .date-btn,
    .time-btn {
      background: var(--card-light);
      color: white;
      border: 1px solid #3a3a4d;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
    }

    .date-btn.active,
    .time-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .screen {
      width: 80%;
      height: 13px;
      background: linear-gradient(90deg, transparent, white, transparent);
      margin: 25px auto 10px;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(255,255,255,0.35);
    }

    .screen-label {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 25px;
    }

    .seat-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
